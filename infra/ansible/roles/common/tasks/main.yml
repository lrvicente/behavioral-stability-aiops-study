---
# Baseline configuration applied to every study host.

- name: Wait for unattended-upgrades / cloud-init to finish before apt
  ansible.builtin.shell: |
    set -e
    while pgrep -x unattended-upg >/dev/null 2>&1; do sleep 5; done
    while pgrep -x cloud-init >/dev/null 2>&1; do sleep 5; done
  changed_when: false

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - wget
      - gnupg
      - software-properties-common
      - python3-pip
      - python3-venv
      - jq
      - htop
      - iotop
      - sysstat
      - net-tools
      - dnsutils
      - tcpdump
      - lsof
      - stress-ng
      - cron
      - chrony
      - rsync
      - unzip
      - git
    state: present

- name: Ensure chrony is enabled and running for accurate timestamps
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

- name: Ensure cron is enabled and running
  ansible.builtin.systemd:
    name: cron
    enabled: true
    state: started

- name: Create study directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/cnsm-study
    - /opt/cnsm-study/scripts
    - /opt/cnsm-study/workloads
    - /var/log/cnsm-faults
    - /var/log/cnsm-workloads

- name: Configure sysstat to collect data every 1 minute
  ansible.builtin.lineinfile:
    path: /etc/default/sysstat
    regexp: '^ENABLED='
    line: 'ENABLED="true"'
  notify: Restart sysstat

- name: Set sar collection interval to 1 minute
  ansible.builtin.copy:
    dest: /etc/cron.d/sysstat
    content: |
      # Generated by Ansible for cnsm2027 study
      # collect every minute, summary at end of day
      */1 * * * * root command -v debian-sa1 > /dev/null && debian-sa1 1 1
      53 23 * * * root command -v sa2 > /dev/null && sa2 -A
    owner: root
    group: root
    mode: "0644"
  notify: Restart cron

- name: Disable automatic security upgrades (we control patch windows in study)
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: false
    state: stopped
  failed_when: false

- name: Tag host with study metadata
  ansible.builtin.copy:
    dest: /etc/cnsm-study-metadata
    content: |
      study_id={{ study_id }}
      hostname={{ inventory_hostname }}
      group={{ group_names | reject('match','study_hosts|all') | first | default('unknown') }}
      provisioned={{ ansible_date_time.iso8601 }}
    owner: root
    group: root
    mode: "0644"

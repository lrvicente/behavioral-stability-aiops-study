---
# 30-fault-injector.yml
# Deploys fault injection script, schedule, and cron job to all study hosts.
#
# IMPORTANT: before running this playbook, you MUST have generated the fault
# schedule and committed it to git. This commit serves as pre-registration
# evidence.
#
# Schedule generation (already done for cycles 1-3):
#   python3 infra/scripts/fault_schedule_gen.py \
#       --start 2026-05-15 --days 90 --seed 42 --density 1.0 \
#       --output protocols/fault_schedule_cycle1.csv
#
# Usage:
#   # Default: cycle 1
#   ansible-playbook -i inventory/hosts.ini playbooks/30-fault-injector.yml
#
#   # Cycle 2 or 3:
#   ansible-playbook -i inventory/hosts.ini playbooks/30-fault-injector.yml -e "cycle=cycle2"
#   ansible-playbook -i inventory/hosts.ini playbooks/30-fault-injector.yml -e "cycle=cycle3"

- name: Verify fault schedule exists before deploying
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    cycle: "cycle1"
  tasks:
    - name: Check schedule file exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../../protocols/fault_schedule_{{ cycle }}.csv"
      register: schedule_stat

    - name: Fail if schedule is missing
      ansible.builtin.fail:
        msg: |
          Fault schedule not found at protocols/fault_schedule_{{ cycle }}.csv.
          Run fault_schedule_gen.py first and commit the output to git
          before deploying fault injection.
          Override cycle with: ansible-playbook -e cycle=cycle2 ...
      when: not schedule_stat.stat.exists

- name: Deploy fault injection to study hosts
  hosts: study_hosts
  become: true
  vars:
    cycle: "cycle1"
  roles:
    - fault_injector
